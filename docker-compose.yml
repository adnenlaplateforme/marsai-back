# Stack de DÉVELOPPEMENT : la base, son interface d'administration et le
# serveur de courrier. L'API ne tourne pas ici — elle tourne sur l'hôte, par
# `npm run dev`, et joint ces trois services par les ports publiés ci-dessous.
#
#   docker compose up -d      # démarre tout
#   docker compose down       # arrête
#   docker compose down -v    # arrête ET efface la base
#
# Le déploiement a son propre fichier, `docker-compose.prod.yml`, qui se lance
# avec `-f` (voir son en-tête). Les deux sont autonomes : ils ne se fusionnent
# pas et ne se complètent pas. `marsai-db` et `mailpit` y sont donc décrits deux
# fois — une modification ici (version d'image, sonde, mot de passe) doit être
# reportée là-bas à la main, rien ne le signalera.
#
# Les deux stacks ne partagent NI conteneurs NI données : le fichier de prod
# porte `name: marsai-prod`, celui-ci garde le nom déduit du dossier
# (`marsai-back`). Lancer la prod sur cette machine ne touchera pas à la base
# de développement.

services:
  marsai-db:
    image: mysql:8.4.8
    restart: always
    ports:
      # Lié à la loopback, et non à 0.0.0.0 comme auparavant. Docker écrit ses
      # règles directement dans la chaîne DOCKER d'iptables, évaluée AVANT
      # celles d'ufw : un `ufw deny 3308` ne protégerait pas ce port.
      - '127.0.0.1:${MYSQL_PORT:-3308}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Ce dossier n'est joué qu'au TOUT premier démarrage, quand le volume est
      # encore vide. Modifier `marsai.sql` ensuite ne change plus rien : il faut
      # passer l'ALTER à la main, ou repartir d'un `down -v`.
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: always
    # Mailpit piège tout le courrier au lieu de le remettre : aucun mail ne part
    # vers une vraie adresse depuis cette machine, même si la base contient de
    # vraies adresses d'abonnés. C'est lui qui remplace le compte de test
    # Ethereal qu'email.service.ts créait au démarrage.
    ports:
      # L'API tourne sur l'hôte en développement : elle joint le SMTP par ce
      # port publié. Il dérive de MAILER_PORT à dessein — c'est le port que
      # l'app compose, les deux ne peuvent donc pas diverger. Le régler sert dès
      # qu'un autre projet occupe déjà 1025 sur la machine.
      - '127.0.0.1:${MAILER_PORT:-1025}:1025'
      # L'interface web, où se lisent les messages : http://127.0.0.1:8025
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      # Une boîte de test ne doit pas grossir sans fin sur le disque.
      MP_MAX_MESSAGES: 500

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - '127.0.0.1:${PHPMYADMIN_PORT:-8080}:80'
    environment:
      PMA_HOST: marsai-db
    depends_on:
      - marsai-db

volumes:
  db_data:
